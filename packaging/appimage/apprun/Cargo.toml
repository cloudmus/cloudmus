[package]
name = "cloudmus-apprun"
version = "0.1.0"
edition = "2021"
description = "The AppImage's AppRun: prepares the environment, runs cloudmus-qt, reports failures to Sentry"
publish = false

[dependencies]
libc = "0.2"
serde_json = "1"
signal-hook = "0.3"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[[bin]]
name = "cloudmus-apprun"
path = "src/main.rs"

# Static (musl) and as small as it gets: it ships in every AppImage.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
