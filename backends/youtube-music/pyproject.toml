[project]
name = "cloudmus-backend-youtube-music"
version = "0.1.0"
description = "cloudmus backend: YouTube Music adapter"
requires-python = ">=3.11"
dependencies = [
    "cloudmus-rpc-common",
    "ytmusicapi>=1.8,<2",
    # Pinned, bumped by hand when YouTube breaks stream extraction. A
    # pre-release version in the specifier lets pip install this nightly.
    "yt-dlp==2026.9.27.232945.dev0",
    "mutagen>=1.47",
    # SOCKS proxies for requests (ALL_PROXY=socks5h://..., set by the front
    # per source — see docs/protocol.md §4.3).
    "PySocks>=1.7",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cloudmus_backend_ytmusic*"]
