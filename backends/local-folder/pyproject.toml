[project]
name = "cloudmus-backend-local-folder"
version = "0.1.0"
description = "cloudmus backend: plays music from a local directory tree (subfolders as playlists)"
requires-python = ">=3.11"
dependencies = [
    "cloudmus-rpc-common",
    "mutagen>=1.47",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cloudmus_backend_local*"]
