[package]
name = "cloudmus-backend-local-folder"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
id3 = "1"
lofty = "0.24"
serde_json = "1"
tempfile = "3"
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_System_Com", "Win32_Foundation"] }

[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"
