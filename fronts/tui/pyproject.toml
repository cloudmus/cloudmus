[project]
name = "cloudmus-tui"
version = "0.1.0"
description = "cloudmus TUI front: spawns backend processes and speaks JSON-RPC 2.0 to them over stdio"
requires-python = ">=3.11"
dependencies = [
    "textual>=8.0",
    "python-mpv>=1.0.6",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
cloudmus = "cloudmus_tui.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cloudmus_tui*"]
