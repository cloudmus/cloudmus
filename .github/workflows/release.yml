# Builds the AppImage on a release tag (x.y.z, e.g. 1.2.0) and attaches it
# to that tag's GitHub release — creating the release if the tag was
# pushed from git, or reusing it if it was created in the GitHub UI
# (which also creates the tag and triggers this same push event).
name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags for cmake/Version.cmake's `git describe`.
          fetch-depth: 0

      - name: Build AppImage
        run: ./build-appimage.sh

      - name: Publish to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          asset="dist/CloudMus-${TAG}-x86_64.AppImage"
          cp dist/CloudMus-x86_64.AppImage "$asset"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
              gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" "$asset" --clobber
