# Builds the AppImage on a release tag (x.y.z, e.g. 1.2.0) and attaches it
# to that tag's GitHub release — creating the release if the tag was
# pushed from git, or reusing it if it was created in the GitHub UI
# (which also creates the tag and triggers this same push event). An
# annotated tag's message becomes the release notes.
name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags for cmake/Version.cmake's `git describe`.
          fetch-depth: 0

      - name: Build AppImage
        env:
          CLOUDMUS_GA4_MEASUREMENT_ID: ${{ secrets.CLOUDMUS_GA4_MEASUREMENT_ID }}
        # A release must contain working analytics, not silently omit it.
        run: |
          test -n "$CLOUDMUS_GA4_MEASUREMENT_ID"
          ./build-appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/CloudMus-x86_64.AppImage

  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build Windows installer
        env:
          CLOUDMUS_GA4_MEASUREMENT_ID: ${{ secrets.CLOUDMUS_GA4_MEASUREMENT_ID }}
        run: |
          test -n "$CLOUDMUS_GA4_MEASUREMENT_ID"
          ./build-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/CloudMus-x86_64-Setup.exe

  windows-smoke:
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
      - name: Install and test packaged runtime
        shell: pwsh
        run: |
          $installDir = "$env:LOCALAPPDATA\Programs\CloudMus"
          $installer = Join-Path $PWD 'CloudMus-x86_64-Setup.exe'
          $process = Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NSIS installation failed: $($process.ExitCode)" }
          $app = Join-Path $installDir 'cloudmus-qt.exe'
          $python = Join-Path $installDir 'python\python.exe'
          if (!(Test-Path $app)) { throw 'Application missing' }
          if (!(Test-Path (Join-Path $installDir 'libmpv-2.dll'))) { throw 'libmpv missing' }
          & $python -c 'import cloudmus_backend_local, cloudmus_backend_yandex, cloudmus_backend_ytmusic, rpc_common, yaml, jsonschema'
          if ($LASTEXITCODE -ne 0) { throw 'Bundled backend imports failed' }
          python packaging/windows/smoke.py $installDir
          if ($LASTEXITCODE -ne 0) { throw 'Backend RPC smoke test failed' }
          $appProcess = Start-Process -FilePath $app -PassThru
          Start-Sleep -Seconds 8
          if ($appProcess.HasExited) { throw "CloudMus exited at startup: $($appProcess.ExitCode)" }
          taskkill /PID $appProcess.Id /T /F | Out-Null
          $uninstaller = Join-Path $installDir 'Uninstall.exe'
          $process = Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NSIS uninstallation failed: $($process.ExitCode)" }

  publish:
    needs: [appimage, windows-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: appimage
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist
      - name: Publish to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          asset="dist/CloudMus-${TAG}-x86_64.AppImage"
          cp dist/CloudMus-x86_64.AppImage "$asset"
          # Release notes = the annotated tag's message minus its first
          # line (the version), see docs/releasing.md. Re-fetched
          # explicitly: checkout can leave the tag as a lightweight one.
          # A lightweight tag (e.g. from the GitHub UI) has no notes to
          # offer — then GitHub's generated ones, and an existing release's
          # notes are left alone.
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          notes=(--generate-notes)
          if [ "$(git cat-file -t "$TAG")" = tag ]; then
              git tag -l --format='%(contents)' "$TAG" | tail -n +2 > notes.md
              notes=(--notes-file notes.md)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
              if [ "${notes[0]}" = --notes-file ]; then
                  gh release edit "$TAG" "${notes[@]}"
              fi
          else
              gh release create "$TAG" --verify-tag --title "$TAG" "${notes[@]}"
          fi
          windows_asset="dist/CloudMus-${TAG}-x86_64-Setup.exe"
          cp dist/CloudMus-x86_64-Setup.exe "$windows_asset"
          gh release upload "$TAG" "$asset" "$windows_asset" --clobber
