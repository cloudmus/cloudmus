# Builds the AppImage, the Windows installer and the macOS DMGs on a
# release tag (x.y.z, e.g. 1.2.0) and attaches them to that tag's GitHub
# release — creating the release if the tag was
# pushed from git, or reusing it if it was created in the GitHub UI
# (which also creates the tag and triggers this same push event). An
# annotated tag's message becomes the release notes.
name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      release: true

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: appimage
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: windows-installer
          path: dist
      - uses: actions/download-artifact@v8
        with:
          pattern: macos-*
          merge-multiple: true
          path: dist
      - name: Publish to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # The AppImage/installer/DMGs are already named with their own
          # version (packaging/appimage and packaging/windows's
          # build-in-docker.sh, packaging/macos/build-app.sh, from `git
          # describe`), which matches TAG
          # exactly for a clean tagged checkout like this one.
          appimage_asset="$(ls dist/CloudMus-*-x86_64.AppImage)"
          windows_asset="$(ls dist/CloudMus-*-x86_64-Setup.exe)"
          macos_assets=(dist/CloudMus-*.dmg)
          # Only the builds of this very tag: a name with a commit count or
          # hash (0.5.1-12-gabc1234, -dirty) is an intermediate build and
          # never goes to a release.
          test "$appimage_asset" = "dist/CloudMus-${TAG}-x86_64.AppImage"
          test "$windows_asset" = "dist/CloudMus-${TAG}-x86_64-Setup.exe"
          test "${macos_assets[*]}" = "dist/CloudMus-${TAG}-arm64.dmg dist/CloudMus-${TAG}-x86_64.dmg"
          # Release notes = the annotated tag's message minus its first
          # line (the version), see docs/releasing.md. Re-fetched
          # explicitly: checkout can leave the tag as a lightweight one.
          # A lightweight tag (e.g. from the GitHub UI) has no notes to
          # offer — then GitHub's generated ones, and an existing release's
          # notes are left alone.
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          notes=(--generate-notes)
          if [ "$(git cat-file -t "$TAG")" = tag ]; then
              git tag -l --format='%(contents)' "$TAG" | tail -n +2 > notes.md
              notes=(--notes-file notes.md)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
              if [ "${notes[0]}" = --notes-file ]; then
                  gh release edit "$TAG" "${notes[@]}"
              fi
          else
              gh release create "$TAG" --verify-tag --title "$TAG" "${notes[@]}"
          fi
          gh release upload "$TAG" "$appimage_asset" "$windows_asset" "${macos_assets[@]}" --clobber
