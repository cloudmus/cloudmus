# The AppImage, the Windows installer, the macOS DMGs and the Android APK, built the same way
# for a release (release.yml) and for every push to develop (develop.yml).
# Uploads them as workflow artifacts, and the debug symbols to Sentry.
name: Build

on:
  workflow_call:
    inputs:
      release:
        description: Release build, with usage statistics (a develop build leaves them out)
        type: boolean
        default: false
      retention-days:
        description: How long the artifacts stay (0 = the repository's default)
        type: number
        default: 0

jobs:
  appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history + tags for cmake/Version.cmake's `git describe`.
          fetch-depth: 0

      # The compiler cache of the previous builds (build-in-docker.sh keeps it
      # in .ccache/): a build recompiles only what the commits changed. The
      # key is new every run so the cache is saved again; the newest older
      # one is restored.
      - name: Restore the compiler cache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-appimage-${{ github.run_id }}
          restore-keys: ccache-appimage-

      - name: Build AppImage
        env:
          # Test builds send no usage statistics: they would only skew the
          # numbers of real users.
          CLOUDMUS_GA4_MEASUREMENT_ID: ${{ inputs.release && secrets.CLOUDMUS_GA4_MEASUREMENT_ID || '' }}
          CLOUDMUS_SENTRY_DSN: ${{ secrets.CLOUDMUS_SENTRY_DSN }}
          RELEASE: ${{ inputs.release }}
        # A build must contain working crash reports, and a release working
        # analytics too, not silently omit them.
        run: |
          if [ "$RELEASE" = true ]; then test -n "$CLOUDMUS_GA4_MEASUREMENT_ID"; fi
          test -n "$CLOUDMUS_SENTRY_DSN"
          ./build-appimage.sh

      - name: Upload debug symbols to Sentry
        uses: ./.github/actions/upload-symbols
        with:
          auth-token: ${{ secrets.SENTRY_AUTH_TOKEN }}
          org: ${{ secrets.SENTRY_ORG }}

      - uses: actions/upload-artifact@v7
        with:
          name: appimage
          path: dist/CloudMus-*-x86_64.AppImage
          retention-days: ${{ inputs.retention-days }}

  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build Windows installer
        env:
          CLOUDMUS_GA4_MEASUREMENT_ID: ${{ inputs.release && secrets.CLOUDMUS_GA4_MEASUREMENT_ID || '' }}
          CLOUDMUS_SENTRY_DSN: ${{ secrets.CLOUDMUS_SENTRY_DSN }}
          RELEASE: ${{ inputs.release }}
        run: |
          if [ "$RELEASE" = true ]; then test -n "$CLOUDMUS_GA4_MEASUREMENT_ID"; fi
          test -n "$CLOUDMUS_SENTRY_DSN"
          ./build-windows.sh

      - name: Upload debug symbols to Sentry
        uses: ./.github/actions/upload-symbols
        with:
          auth-token: ${{ secrets.SENTRY_AUTH_TOKEN }}
          org: ${{ secrets.SENTRY_ORG }}

      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: dist/CloudMus-*-x86_64-Setup.exe
          retention-days: ${{ inputs.retention-days }}

  macos:
    strategy:
      # One arch failing says nothing about the other: let it finish (and
      # save its libmpv cache).
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      # libmpv and what it's built from take ~20 minutes; rebuilt only when
      # build-deps.sh (its versions) changes.
      - name: Restore libmpv
        uses: actions/cache@v6
        with:
          path: packaging/macos/deps/${{ matrix.arch }}
          key: macos-deps-${{ matrix.arch }}-${{ hashFiles('packaging/macos/build-deps.sh') }}

      - name: Restore Qt
        uses: actions/cache@v6
        with:
          path: ~/Qt/6.9.3
          key: macos-qt-6.9.3

      - name: Install the build tools
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet cmake ninja meson pkgconf aqtinstall jinja2 pyyaml
          if [ ! -d "$HOME/Qt/6.9.3/macos" ]; then
              .venv/bin/aqt install-qt mac desktop 6.9.3 clang_64 -O "$HOME/Qt"
          fi

      - name: Build the DMG
        env:
          CLOUDMUS_GA4_MEASUREMENT_ID: ${{ inputs.release && secrets.CLOUDMUS_GA4_MEASUREMENT_ID || '' }}
          CLOUDMUS_SENTRY_DSN: ${{ secrets.CLOUDMUS_SENTRY_DSN }}
          RELEASE: ${{ inputs.release }}
        run: |
          if [ "$RELEASE" = true ]; then test -n "$CLOUDMUS_GA4_MEASUREMENT_ID"; fi
          test -n "$CLOUDMUS_SENTRY_DSN"
          packaging/macos/build-app.sh

      - name: Upload debug symbols to Sentry
        uses: ./.github/actions/upload-symbols
        with:
          auth-token: ${{ secrets.SENTRY_AUTH_TOKEN }}
          org: ${{ secrets.SENTRY_ORG }}
          source-root: ${{ github.workspace }}

      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: dist/CloudMus-*-${{ matrix.arch }}.dmg
          retention-days: ${{ inputs.retention-days }}

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Restore Qt
        uses: actions/cache@v6
        with:
          path: ~/Qt/6.7.3
          key: android-qt-6.7.3

      - name: Restore Gradle's downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-gradle-${{ hashFiles('fronts/mobile/android/build.gradle') }}

      - name: Install the build tools
        run: |
          sudo apt-get update -qq
          # Besides ninja, what Qt's own tools (qmlimportscanner, moc) run on.
          sudo apt-get install -y -qq ninja-build libglib2.0-0t64 libgl1 libegl1 libdbus-1-3
          # bundle-python.sh and the protocol's code generation use the repo's .venv.
          python -m venv .venv
          .venv/bin/pip install --quiet aqtinstall jinja2 pyyaml
          if [ ! -d "$HOME/Qt/6.7.3/android_arm64_v8a" ]; then
              .venv/bin/aqt install-qt linux desktop 6.7.3 linux_gcc_64 -O "$HOME/Qt" -m qtremoteobjects
              .venv/bin/aqt install-qt linux android 6.7.3 android_arm64_v8a -O "$HOME/Qt" -m qtremoteobjects
          fi
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
              "platforms;android-34" "build-tools;35.0.0" "ndk;26.1.10909125" > /dev/null

      - name: Build the APK
        env:
          KEYSTORE_BASE64: ${{ secrets.CLOUDMUS_ANDROID_KEYSTORE_BASE64 }}
          CLOUDMUS_ANDROID_KEY_ALIAS: ${{ secrets.CLOUDMUS_ANDROID_KEY_ALIAS }}
          CLOUDMUS_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.CLOUDMUS_ANDROID_KEYSTORE_PASSWORD }}
        # Always the one key: Android won't update an app from an APK signed
        # with another, and uninstalling it takes the sign-ins with it.
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$CLOUDMUS_ANDROID_KEY_ALIAS"
          test -n "$CLOUDMUS_ANDROID_KEYSTORE_PASSWORD"
          export CLOUDMUS_ANDROID_KEYSTORE="$RUNNER_TEMP/release.keystore"
          base64 -d <<< "$KEYSTORE_BASE64" > "$CLOUDMUS_ANDROID_KEYSTORE"
          export ANDROID_SDK_ROOT="$ANDROID_HOME" CLOUDMUS_JAVA17_HOME="$JAVA_HOME_17_X64" QT_ROOT="$HOME/Qt/6.7.3"
          ./build-android.sh arm64-v8a
          # Named like the other builds, from the same `git describe`.
          version="$(git describe --tags --dirty --match '[0-9]*')"
          mv dist/cloudmus-mobile-arm64-v8a.apk "dist/CloudMus-${version}-arm64-v8a.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: dist/CloudMus-*-arm64-v8a.apk
          retention-days: ${{ inputs.retention-days }}
