$schema: "http://json-schema.org/draft-07/schema#"
$id: capabilities.yaml
title: Capabilities
type: object
required: [playback, browse, feedback, download, auth]
properties:
  playback:
    type: object
    required: [providesStream, selfPlayback, controls]
    properties:
      providesStream: {type: boolean}
      # optional (1.8+): playback.resolveStream for preparing a future track
      resolveStream: {type: boolean}
      selfPlayback: {type: boolean}
      controls:
        type: object
        required: [pause, seek, volume]
        properties:
          pause: {type: boolean}
          seek: {type: boolean}
          volume: {type: boolean}
        additionalProperties: false
    additionalProperties: false
  browse:
    type: object
    required: [playlists, likedTracks, radio, search]
    properties:
      playlists: {type: boolean}
      likedTracks: {type: boolean}
      radio: {type: boolean}
      search: {type: boolean}
      # optional (1.3+): catalog.getTrackPlaylists / addToPlaylist /
      # removeFromPlaylist on the user's own (Playlist.editable) playlists
      editPlaylists: {type: boolean}
    additionalProperties: false
  feedback:
    type: object
    required: [like, dislike, skip]
    properties:
      like: {type: boolean}
      dislike: {type: boolean}
      skip: {type: boolean}
    additionalProperties: false
  download: {type: boolean}
  # optional (1.7+): download/progress for, and catalog.cancelDownload of,
  # a catalog.downloadTrack given a downloadId
  downloadControl: {type: boolean}
  # optional (1.4+): settings.describe / settings.update
  settings: {type: boolean}
  # optional (1.10+): the source reaches the network, so the front's
  # per-source Connection setting applies. Absent means true.
  network: {type: boolean}
  # optional (1.11+): localization.setLanguage; `locales` lists the
  # languages (BCP-47) the source can answer in, English being the default
  localization:
    type: object
    required: [locales]
    properties:
      locales: {type: array, items: {type: string}}
    additionalProperties: false
  auth:
    type: object
    required: [required, flow]
    properties:
      required: {type: boolean}
      flow: {type: string, enum: [none, deviceCode, usernamePassword, oauthRedirect]}
    additionalProperties: false
additionalProperties: false
