$schema: "http://json-schema.org/draft-07/schema#"
$id: stream_descriptor.yaml
title: StreamDescriptor
type: object
required: [kind, url, mimeType]
properties:
  kind: {type: string, enum: [url]}   # discriminator, reserved for future stream kinds
  url: {type: string}
  mimeType: {type: string}
  headers:                            # optional, extra HTTP headers the front must send when fetching
    type: object
    additionalProperties: {type: string}
  codec: {type: string}               # optional (1.15+), lowercase short name of the audio codec, e.g. "mp3", "aac", "opus"
  bitrateKbps: {type: integer, minimum: 1}   # optional (1.15+), the stream's bitrate in kbit/s
additionalProperties: false
