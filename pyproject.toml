[project]
name = "ym-player"
version = "0.1.0"
description = "Консольный плеер/загрузчик для Яндекс.Музыки (личное использование)"
requires-python = ">=3.11"
dependencies = [
    "yandex-music>=3.0.0",
    "click>=8.1",
    "textual>=8.0",
    "mutagen>=1.47",
    "python-mpv>=1.0.6",
]

[project.scripts]
ym = "ym_player.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ym_player*"]
